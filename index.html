    <style>
        /* Define color variables for light and dark themes */
        :root[data-theme="light"] {
            --bg-primary: #f1f5f9; --bg-secondary: #ffffff; --bg-tertiary: #e2e8f0;
            --text-primary: #1e293b; --text-secondary: #475569; --text-tertiary: #64748b;
            --border-color: #e2e8f0; --accent-color: #3b82f6; --hover-bg: #f8fafc;
            --btn-default-bg: #e2e8f0; --btn-default-text: #4a5568;
            --timer-bg: #e2e8f0; --timer-text: #1e293b;
            --review-border: #93c5fd; /* blue-300 */
        }
        :root[data-theme="dark"] {
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-tertiary: #334155;
            --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-tertiary: #cbd5e1;
            --border-color: #334155; --accent-color: #60a5fa; --hover-bg: #334155;
            --btn-default-bg: #334155; --btn-default-text: #e2e8f0;
            --timer-bg: #334155; --timer-text: #e2e8f0;
            --review-border: #3b82f6; /* blue-500 */
        }

        /* Basic styles using variables */
        body { background-color: var(--bg-primary); color: var(--text-primary); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .card { background-color: var(--bg-secondary); transition: background-color 0.3s ease; }
        .text-muted { color: var(--text-secondary); }
        .border-default { border-color: var(--border-color); }
        .hover-bg-soft:hover { background-color: var(--hover-bg); }
        .btn-default { background-color: var(--btn-default-bg); color: var(--btn-default-text); }
        .btn-default:hover { filter: brightness(95%); }
        #timer { background-color: var(--timer-bg); color: var(--timer-text); }
        .theme-toggle-bg { background-color: #4b5563; }
        #theme-toggle:checked + .theme-toggle-bg .dot { transform: translateX(1.5rem); }

        /* Custom scrollbar & selection */
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        ::selection { background-color: var(--accent-color); color: white; }

        /* Navigation & Focus Styles */
        .nav-btn-default { background-color: #e2e8f0; color: #4a5568; }
        .nav-btn-answered { background-color: #9ae6b4; color: #276749; }
        .nav-btn-unanswered { background-color: #feb2b2; color: #9b2c2c; }
        .nav-btn-review { background-color: #d6bcfa; color: #553c9a; }
        .nav-btn-current, .option-focused { box-shadow: 0 0 0 3px var(--accent-color); }
        @keyframes pulse-focus { 0% { box-shadow: 0 0 0 0px var(--accent-color); } 100% { box-shadow: 0 0 0 4px transparent; } }
        .panel-focused-transient { animation: pulse-focus 0.6s ease-out; }
        .panel-focused { box-shadow: 0 0 0 2px var(--accent-color); }

        /* Notification Styling */
        #notification-container { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
        .notification { width: fit-content; min-width: 220px; max-width: 350px; padding: 0.5rem 1rem; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 0.75rem; font-weight: 500; animation: notification-lifecycle 2s ease-in-out forwards; color: #ffffff; }
        .notification.info { background-color: #2563eb; }
        .notification.success { background-color: #16a34a; }
        .notification.warning { background-color: #f97316; }
        @keyframes notification-lifecycle { 0% { transform: translateY(-150%) scale(0.8); opacity: 0; } 15% { transform: translateY(0) scale(1); opacity: 1; } 85% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-150%) scale(0.8); opacity: 0; } }

        /* Modal Styling */
        .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: center; align-items: center; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); animation: fadeIn 0.3s ease-out; padding: 1rem; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Settings Toggle Styling */
        .settings-toggle-bg { background-color: #4b5563; transition: background-color 0.3s ease; }
        .settings-toggle-dot { transform: translateX(0); transition: transform 0.3s ease; }
        input:checked ~ .settings-toggle-bg { background-color: var(--accent-color); }
        input:checked ~ .settings-toggle-dot { transform: translateX(1.5rem); }
        
        /* Footer & "Made By" Modal */
        .social-link { transition: transform 0.2s ease-in-out, color 0.2s ease-in-out; }
        .social-link:hover { transform: scale(1.2); color: var(--accent-color); }
        #made-by-modal .content { font-family: 'Arial Black', Gadget, sans-serif; font-size: clamp(1rem, 5vw, 3rem); text-transform: uppercase; }
        #made-by-modal .letter { display: inline-block; line-height: 1em; opacity: 0; animation: fade-in 0.5s forwards; animation-delay: calc(0.1s * var(--i)); }
        @keyframes fade-in { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header id="main-header" class="w-full p-4 card shadow-md sticky top-0 z-20 hidden">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold" style="color: var(--accent-color);">Practice Test</h2>
                <p id="user-info" class="text-sm text-muted"></p>
            </div>
            <div class="flex items-center gap-4">
                <button id="settings-btn" class="text-muted hover:text-accent-color transition-colors"><i class="fas fa-cog fa-lg"></i></button>
                <div class="flex items-center gap-2">
                    <i id="theme-icon" class="fas fa-sun fa-lg text-muted"></i>
                    <label class="flex items-center cursor-pointer">
                        <div class="relative">
                            <input type="checkbox" id="theme-toggle" class="sr-only">
                            <div class="theme-toggle-bg block w-14 h-8 rounded-full"><div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition-transform"></div></div>
                        </div>
                    </label>
                </div>
                <div id="timer" class="text-2xl font-bold px-4 py-2 rounded-lg"><i class="far fa-clock"></i> 00:00</div>
            </div>
        </div>
    </header>

    <div id="notification-container"></div>

    <main id="app" class="container mx-auto p-4 md:p-8 max-w-7xl flex-grow">
        <!-- App content will be rendered here -->
    </main>
    
    <footer class="w-full text-center p-6 border-t border-default card">
        <p class="text-muted mb-4">Practice makes perfect. Keep pushing your limits!</p>
        <p class="text-sm text-tertiary">
            <button id="made-by-btn" class="group relative hover:text-accent-color transition-colors">
                Made with <i class="fas fa-heart text-red-500"></i> by 
                <span class="font-bold italic bg-gradient-to-r from-yellow-500 to-amber-500 bg-clip-text text-transparent hover:from-amber-500 hover:to-yellow-500 transition-all duration-300">
                    illogical.exe
                </span>
                <span class="absolute -top-10 left-1/2 transform -translate-x-1/2 backdrop-blur-md px-3 py-1.5 rounded-lg text-sm opacity-0 group-hover:opacity-100 transition-all duration-200 whitespace-nowrap shadow-lg" style="background-color: var(--tooltip-bg); color: var(--tooltip-text); border: 2px solid var(--tooltip-border);">
                    Click to know more about me!
                </span>
            </button>
        </p>
    </footer>

    <!-- Modals are injected here -->
    <div id="modal-container"></div>

    <script>
    // === App State ===
    let questions = [];
    let userAnswers = {};
    let markedForReview = new Set();
    let currentQuestionIndex = 0;
    let timerInterval;
    let timeLeft = 0;
    let examDuration = 0;
    let userName = 'Guest';
    let focusedSection = 'question'; // 'nav' or 'question'
    let focusedOptionIndex = -1; // -1 means no option is focused
    let notificationSettings = { selection: true, navigation: true, marking: true, submission: true };

    // === DOM Element References ===
    const appContainer = document.getElementById('app');
    const modalContainer = document.getElementById('modal-container');
    const madeByBtn = document.getElementById('made-by-btn');
    const notificationContainer = document.getElementById('notification-container');
    const mainHeader = document.getElementById('main-header');

    // === Templates ===
    const startScreenHTML = `
        <div id="start-screen" class="text-center card p-8 rounded-2xl shadow-lg max-w-2xl mx-auto">
            <i class="fas fa-book-open fa-3x text-blue-500 mb-4"></i>
            <h1 class="text-4xl font-bold mb-2">SmartQuiz Pro</h1>
            <p class="text-muted mb-8">Enter your name, upload questions, set the timer, and start.</p>
            <div class="max-w-md mx-auto space-y-6">
                <div>
                    <label for="name-input" class="block text-left font-semibold text-muted mb-2">Your Name</label>
                    <input type="text" id="name-input" placeholder="Enter your name" class="w-full p-3 border border-default rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 card text-primary">
                </div>
                <div>
                    <label for="json-upload" class="block text-left font-semibold text-muted mb-2">Upload Questions File (.json)</label>
                    <input type="file" id="json-upload" accept=".json" class="w-full text-sm text-muted file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                </div>
                <div>
                    <label for="time-select" class="block text-left font-semibold text-muted mb-2">Exam Duration (minutes)</label>
                    <input type="number" id="time-select" value="60" min="1" class="w-full p-3 border border-default rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 card text-primary">
                </div>
                <button id="start-btn" disabled class="w-full bg-gray-400 text-white font-bold py-3 px-4 rounded-lg transition-all duration-300 ease-in-out flex items-center justify-center space-x-2">
                    <i class="fas fa-play-circle"></i><span>Start Exam</span>
                </button>
                <p id="upload-status" class="text-sm text-red-500 h-4"></p>
            </div>
        </div>`;
    
    const examScreenHTML = `
        <div id="exam-screen">
            <div id="question-nav-wrapper" class="rounded-2xl transition-shadow duration-300 mb-6 overflow-x-auto">
                <div id="question-nav" class="card p-4 rounded-2xl shadow-md grid grid-flow-col auto-cols-max md:grid-flow-row md:grid-cols-10 gap-2"></div>
            </div>
            <div id="main-content-wrapper" class="flex flex-col lg:flex-row gap-6 rounded-2xl transition-shadow duration-300">
                <div class="lg:w-2/3 card p-6 md:p-8 rounded-2xl shadow-md">
                    <div id="question-container">
                        <p class="text-lg font-semibold mb-6" id="question-text"></p>
                        <div id="options-container" class="space-y-4"></div>
                    </div>
                </div>
                <div class="lg:w-1/3">
                    <div class="card p-6 rounded-2xl shadow-md sticky top-24">
                        <h3 class="font-bold text-xl mb-4">Actions</h3>
                        <div class="space-y-3">
                            <button id="prev-btn" class="w-full btn-default font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2"><i class="fas fa-arrow-left"></i><span>Previous</span></button>
                            <button id="next-btn" class="w-full btn-default font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2"><i class="fas fa-arrow-right"></i><span>Next</span></button>
                            <button id="mark-btn" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2"><i class="far fa-bookmark"></i><span>Mark for Review</span></button>
                            <button id="clear-btn" class="w-full bg-yellow-400 hover:bg-yellow-500 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2"><i class="fas fa-eraser"></i><span>Clear Selection</span></button>
                            <button id="submit-btn" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg transition-colors mt-8 flex items-center justify-center space-x-2"><i class="fas fa-check-circle"></i><span>Submit Exam</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>`;

    const resultsScreenHTML = `
        <div id="results-screen" class="card p-6 md:p-8 rounded-2xl shadow-lg">
            <div class="text-center mb-8">
                <h2 class="text-4xl font-bold mb-2" style="color: var(--accent-color);">Test Complete!</h2>
                <p class="text-muted">Here's how you performed, ${userName}.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center mb-10">
                <div class="bg-green-100 p-6 rounded-xl"><p class="text-4xl font-bold text-green-700" id="correct-count">0</p><p class="font-semibold text-green-800">Correct</p></div>
                <div class="bg-red-100 p-6 rounded-xl"><p class="text-4xl font-bold text-red-700" id="incorrect-count">0</p><p class="font-semibold text-red-800">Incorrect</p></div>
                <div class="bg-gray-100 p-6 rounded-xl"><p class="text-4xl font-bold text-gray-700" id="unanswered-count">0</p><p class="font-semibold text-gray-800">Unanswered</p></div>
            </div>
            <div class="text-center bg-blue-50 border-2 border-blue-200 p-6 rounded-xl mb-10">
                <p class="text-xl text-blue-800 font-medium">Final Score</p>
                <p class="text-6xl font-extrabold text-blue-600" id="final-score">0</p>
            </div>
            <div id="review-container" class="mt-10"></div>
            <div class="mt-10 text-center space-x-4">
                <button id="retest-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg transition-colors"><i class="fas fa-redo-alt"></i> Retest</button>
                <button id="new-test-btn" class="bg-gray-700 hover:bg-gray-800 text-white font-bold py-3 px-6 rounded-lg transition-colors"><i class="fas fa-file-alt"></i> Start New Test</button>
            </div>
        </div>`;

    // === Core App Logic ===
    
    function init() {
        mainHeader.classList.add('hidden');
        const savedSettings = JSON.parse(localStorage.getItem('notificationSettings'));
        if (savedSettings) notificationSettings = savedSettings;
        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);
        
        appContainer.innerHTML = startScreenHTML;
        addStartScreenListeners();
        
        document.addEventListener('keydown', handleKeyPress);
        madeByBtn.addEventListener('click', showMadeByModal);
    }

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        if (themeToggle) themeToggle.checked = theme === 'dark';
        if (themeIcon) {
            themeIcon.className = theme === 'dark' 
                ? 'fas fa-moon fa-lg text-muted' 
                : 'fas fa-sun fa-lg text-muted';
        }
    }

    function showNotification(message, type = 'info', category) {
        if (notificationSettings[category] === false) return;
        if (notificationContainer.children.length >= 3) {
            notificationContainer.firstChild.remove();
        }
        const notif = document.createElement('div');
        notif.className = `notification ${type}`;
        notif.textContent = message;
        notificationContainer.appendChild(notif);
        setTimeout(() => notif.remove(), 2000);
    }

    function handleKeyPress(e) {
        if (!document.getElementById('exam-screen')) return;

        const key = e.key.toLowerCase();
        
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'enter', ' ', '1', 'a', '2', 'b', '3', 'c', '4', 'd'].includes(key)) {
            e.preventDefault();
        } else {
            return;
        }

        if (key === 'arrowup') {
            if (focusedSection === 'question') {
                if (focusedOptionIndex <= 0) {
                    focusedSection = 'nav';
                    focusedOptionIndex = -1;
                    updateFocusVisuals(true);
                } else {
                    navigateOptions(-1);
                }
            }
        } else if (key === 'arrowdown') {
            if (focusedSection === 'nav') {
                focusedSection = 'question';
                focusedOptionIndex = 0;
                updateFocusVisuals(true);
            } else {
                navigateOptions(1);
            }
        } else if (key === 'arrowleft') {
            navigateQuestion(-1, true);
        } else if (key === 'arrowright') {
            navigateQuestion(1, true);
        } else if (['1', 'a', '2', 'b', '3', 'c', '4', 'd'].includes(key)) {
            const optionKeys = {'1': 0, 'a': 0, '2': 1, 'b': 1, '3': 2, 'c': 2, '4': 3, 'd': 3};
            const optionIndex = optionKeys[key];
            const wrappers = document.querySelectorAll('.option-wrapper');
            if (wrappers[optionIndex]) wrappers[optionIndex].click();
        } else if (key === ' ') { // Spacebar to select/deselect
            if (focusedSection === 'question' && focusedOptionIndex !== -1) {
                const wrappers = document.querySelectorAll('.option-wrapper');
                if (wrappers[focusedOptionIndex]) wrappers[focusedOptionIndex].click();
            }
        } else if (key === 'enter') {
            submitAndNext();
        }
    }
    
    // === Screen Transitions & Listeners ===

    function addStartScreenListeners() {
        document.getElementById('json-upload').addEventListener('change', handleFileUpload);
        document.getElementById('start-btn').addEventListener('click', startExam);
    }

    function addHeaderListeners() {
        document.getElementById('theme-toggle').addEventListener('change', (e) => {
            const newTheme = e.target.checked ? 'dark' : 'light';
            applyTheme(newTheme);
            localStorage.setItem('theme', newTheme);
        });
        document.getElementById('settings-btn').addEventListener('click', showSettingsModal);
    }
    
    function addExamScreenListeners() {
        document.getElementById('prev-btn').addEventListener('click', () => navigateQuestion(-1, true));
        document.getElementById('next-btn').addEventListener('click', () => {
            const qId = questions[currentQuestionIndex].id;
            if (!userAnswers.hasOwnProperty(qId)) {
                showNotification(`Question ${currentQuestionIndex + 1} Skipped`, 'warning', 'submission');
            }
            navigateQuestion(1, true);
        });
        document.getElementById('mark-btn').addEventListener('click', toggleMarkReview);
        document.getElementById('clear-btn').addEventListener('click', clearAnswer);
        document.getElementById('submit-btn').addEventListener('click', () => showConfirmationModal('Are you sure you want to submit the exam?', submitExam));
    }
    
    function addResultsScreenListeners() {
        document.getElementById('retest-btn').addEventListener('click', startExam);
        document.getElementById('new-test-btn').addEventListener('click', init);
    }

    // === Exam Logic ===

    function handleFileUpload(event) {
        const file = event.target.files[0];
        const uploadStatus = document.getElementById('upload-status');
        if (!file || file.type !== 'application/json') {
            uploadStatus.textContent = 'Please upload a valid .json file.';
            return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const parsedQuestions = JSON.parse(e.target.result);
                if (Array.isArray(parsedQuestions) && parsedQuestions.length > 0 && parsedQuestions[0].question) {
                    questions = parsedQuestions; // Store globally
                    uploadStatus.textContent = `${questions.length} questions loaded.`;
                    uploadStatus.classList.replace('text-red-500', 'text-green-600');
                    document.getElementById('start-btn').disabled = false;
                    document.getElementById('start-btn').classList.replace('bg-gray-400', 'bg-blue-500');
                } else { throw new Error('Invalid JSON format.'); }
            } catch (error) {
                uploadStatus.textContent = 'Error parsing JSON file.';
            }
        };
        reader.readAsText(file);
    }

    function startExam() {
        const nameInput = document.getElementById('name-input');
        if (nameInput) { // Only read from DOM if on start screen
            userName = nameInput.value.trim() || 'Guest';
        }

        userAnswers = {};
        markedForReview = new Set();
        currentQuestionIndex = 0;
        focusedSection = 'question';
        focusedOptionIndex = -1;
        clearInterval(timerInterval);
        
        const timeSelect = document.getElementById('time-select');
        if (timeSelect) {
            examDuration = parseInt(timeSelect.value, 10) * 60;
        }
        timeLeft = examDuration;

        mainHeader.classList.remove('hidden');
        appContainer.innerHTML = examScreenHTML;
        addHeaderListeners();
        addExamScreenListeners();
        applyTheme(localStorage.getItem('theme') || 'light');
        
        document.getElementById('user-info').textContent = `${userName} - ${new Date().toLocaleDateString()}`;
        
        updateTimerDisplay();
        timerInterval = setInterval(updateTimer, 1000);
        renderQuestionNav();
        renderQuestion(currentQuestionIndex);
        updateFocusVisuals();
    }

    function submitExam() {
        clearInterval(timerInterval);
        const timerEl = document.getElementById('timer');
        const settingsBtn = document.getElementById('settings-btn');
        if (timerEl) timerEl.style.display = 'none';
        if (settingsBtn) settingsBtn.style.display = 'none';
        appContainer.innerHTML = resultsScreenHTML.replace(/\$\{userName\}/g, userName);
        addResultsScreenListeners();
        calculateAndDisplayResults();
    }
    
    function updateTimer() {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            showNotification('Time is up! Exam submitted.', 'warning', 'submission');
            submitExam();
        }
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        const timerEl = document.getElementById('timer');
        if (timerEl) {
            timerEl.innerHTML = `<i class="far fa-clock"></i> ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
    }

    function renderQuestion(index) {
        const question = questions[index];
        document.getElementById('question-text').innerHTML = `Q ${index + 1}: ${question.question}`;
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        question.options.forEach((option, i) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'option-wrapper border border-default rounded-lg p-4 hover-bg-soft transition-all duration-200 cursor-pointer flex items-center';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `q${question.id}`;
            radio.className = 'mr-3 form-radio h-5 w-5 accent-blue-500 pointer-events-none';
            if (userAnswers[question.id] === i) radio.checked = true;

            const label = document.createElement('label');
            label.textContent = option;
            label.className = 'text-muted cursor-pointer w-full';

            wrapper.appendChild(radio);
            wrapper.appendChild(label);
            wrapper.addEventListener('click', () => {
                const questionId = questions[currentQuestionIndex].id;
                // If it's already selected, clear it. Otherwise, select it.
                if (radio.checked) {
                    clearAnswer();
                } else {
                    radio.checked = true;
                    saveAnswer(questionId, i);
                }
            });
            optionsContainer.appendChild(wrapper);
        });

        document.getElementById('prev-btn').disabled = index === 0;
        document.getElementById('next-btn').disabled = index === questions.length - 1;
        updateQuestionNavColors();
        updateFocusVisuals();
    }

    function renderQuestionNav() {
        const questionNav = document.getElementById('question-nav');
        questionNav.innerHTML = '';
        questions.forEach((q, index) => {
            const navBtn = document.createElement('button');
            navBtn.textContent = index + 1;
            navBtn.classList.add('w-12', 'h-10', 'rounded-md', 'font-bold', 'transition-all', 'duration-200', 'flex-shrink-0');
            navBtn.addEventListener('click', () => {
                currentQuestionIndex = index;
                renderQuestion(currentQuestionIndex);
                showNotification(`Moved to Question ${index + 1}`, 'info', 'navigation');
            });
            questionNav.appendChild(navBtn);
        });
        updateQuestionNavColors();
    }

    function updateQuestionNavColors() {
        const navButtons = document.querySelectorAll('#question-nav button');
        navButtons.forEach((btn, i) => {
            const qId = questions[i].id;
            btn.className = 'w-12 h-10 rounded-md font-bold transition-all duration-200 flex-shrink-0';
            if (markedForReview.has(qId)) btn.classList.add('nav-btn-review');
            else if (userAnswers.hasOwnProperty(qId)) btn.classList.add('nav-btn-answered');
            else btn.classList.add('nav-btn-default');
            if (i === currentQuestionIndex) btn.classList.add('nav-btn-current');
        });
    }

    function saveAnswer(questionId, answerIndex) {
        if (userAnswers[questionId] === answerIndex) return;
        userAnswers[questionId] = answerIndex;
        updateQuestionNavColors();
        const optionLabels = ['A', 'B', 'C', 'D'];
        showNotification(`Option ${optionLabels[answerIndex]} Selected`, 'info', 'selection');
    }

    function clearAnswer() {
        const questionId = questions[currentQuestionIndex].id;
        if (userAnswers.hasOwnProperty(questionId)) {
            delete userAnswers[questionId];
            renderQuestion(currentQuestionIndex);
            showNotification(`Selection cleared for Q${currentQuestionIndex + 1}`, 'warning', 'selection');
        }
    }

    function toggleMarkReview() {
        const questionId = questions[currentQuestionIndex].id;
        const message = markedForReview.has(questionId) ? `unmarked` : `marked for review`;
        if (markedForReview.has(questionId)) markedForReview.delete(questionId);
        else markedForReview.add(questionId);
        showNotification(`Question ${currentQuestionIndex + 1} ${message}`, 'info', 'marking');
        updateQuestionNavColors();
    }

    function submitAndNext() {
        const qId = questions[currentQuestionIndex].id;
        if (userAnswers.hasOwnProperty(qId)) {
            showNotification(`Question ${currentQuestionIndex + 1} Submitted`, 'success', 'submission');
        } else {
            showNotification(`Question ${currentQuestionIndex + 1} Skipped`, 'warning', 'submission');
        }
        navigateQuestion(1);
    }

    // === Navigation Logic ===

    function navigateQuestion(direction, showNotif = false) {
        const newIndex = currentQuestionIndex + direction;
        if (newIndex >= 0 && newIndex < questions.length) {
            currentQuestionIndex = newIndex;
            focusedOptionIndex = -1;
            renderQuestion(currentQuestionIndex);
            if (showNotif) {
                showNotification(`Moved to Question ${newIndex + 1}`, 'info', 'navigation');
            }
        }
    }

    function navigateOptions(direction) {
        const options = document.querySelectorAll('.option-wrapper');
        if (!options.length) return;
        const newIndex = focusedOptionIndex + direction;
        if (newIndex >= 0 && newIndex < options.length) {
            focusedOptionIndex = newIndex;
            updateFocusVisuals();
        }
    }
    
    function navigateGrid(direction) {
        let newIndex = currentQuestionIndex + direction;
        if (newIndex < 0) newIndex = questions.length - 1;
        if (newIndex >= questions.length) newIndex = 0;
        currentQuestionIndex = newIndex;
        renderQuestion(currentQuestionIndex);
        showNotification(`Moved to Question ${newIndex + 1}`, 'info', 'navigation');
    }

    function updateFocusVisuals(isPanelSwitch = false) {
        document.querySelectorAll('.panel-focused, .panel-focused-transient, .option-focused, .nav-btn-current').forEach(el => {
            el.classList.remove('panel-focused', 'panel-focused-transient', 'option-focused', 'nav-btn-current');
        });

        const navButtons = document.querySelectorAll('#question-nav button');
        if (navButtons[currentQuestionIndex]) navButtons[currentQuestionIndex].classList.add('nav-btn-current');

        const targetPanel = focusedSection === 'nav' ? document.getElementById('question-nav-wrapper') : document.getElementById('main-content-wrapper');
        targetPanel.classList.add('panel-focused');
        if (isPanelSwitch) {
            targetPanel.classList.add('panel-focused-transient');
            setTimeout(() => targetPanel.classList.remove('panel-focused-transient'), 600);
        }

        if (focusedSection === 'question' && focusedOptionIndex !== -1) {
            const options = document.querySelectorAll('.option-wrapper');
            if (options[focusedOptionIndex]) {
                options[focusedOptionIndex].classList.add('option-focused');
                options[focusedOptionIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        } else if (focusedSection === 'nav') {
            if (navButtons[currentQuestionIndex]) {
                navButtons[currentQuestionIndex].scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
            }
        }
    }

    // === Results Page Logic ===

    function calculateAndDisplayResults() {
        let correct = 0, incorrect = 0, score = 0;
        questions.forEach(q => {
            if (userAnswers.hasOwnProperty(q.id)) {
                if (userAnswers[q.id] === q.answer) { correct++; score += 2; } 
                else { incorrect++; score -= 0.5; }
            }
        });
        document.getElementById('correct-count').textContent = correct;
        document.getElementById('incorrect-count').textContent = incorrect;
        document.getElementById('unanswered-count').textContent = questions.length - (correct + incorrect);
        document.getElementById('final-score').textContent = score.toFixed(2);
        renderReview();
    }
    
    function renderReview() {
        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '<h3 class="text-2xl font-bold mb-6 text-center text-primary">Question Review</h3>';
        questions.forEach((q, index) => {
            const userAnswer = userAnswers[q.id];
            const isCorrect = userAnswer === q.answer;
            const isAnswered = userAnswers.hasOwnProperty(q.id);
            let statusClass, textClass;
            if (isAnswered) {
                statusClass = isCorrect ? 'bg-green-50' : 'bg-red-50';
                textClass = isCorrect ? 'text-green-800' : 'text-red-800';
            } else {
                statusClass = 'bg-gray-50'; textClass = 'text-gray-800';
            }

            const reviewItem = document.createElement('div');
            reviewItem.className = `p-6 rounded-xl border-2 mb-4 ${statusClass}`;
            reviewItem.style.borderColor = 'var(--review-border)';
            
            let resourcesButton = '';
            if (q.resources) {
                resourcesButton = `<button onclick="showResourcesModal(${q.id})" class="mt-3 bg-blue-100 text-blue-700 hover:bg-blue-200 font-semibold py-1 px-3 rounded-full text-sm"><i class="fas fa-book"></i> View Resources</button>`;
            }

            reviewItem.innerHTML = `
                <p class="font-bold text-lg mb-4 ${textClass}">Q ${index + 1}: ${q.question}</p>
                <div class="space-y-2 mb-4">
                    ${q.options.map((opt, i) => {
                        let icon = '<i class="far fa-circle mr-2 text-gray-400"></i>';
                        if (i === q.answer) icon = '<i class="fas fa-check-circle text-green-500 mr-2"></i>';
                        if (isAnswered && !isCorrect && i === userAnswer) icon = '<i class="fas fa-times-circle text-red-500 mr-2"></i>';
                        return `<p class="${textClass}">${icon}${opt}</p>`;
                    }).join('')}
                </div>
                <div class="mt-4 pt-4 border-t" style="border-color: var(--review-border);">
                    <p class="font-semibold ${textClass}">Explanation:</p>
                    <p class="text-gray-600">${q.explanation || 'No explanation provided.'}</p>
                    ${resourcesButton}
                </div>`;
            reviewContainer.appendChild(reviewItem);
        });
    }

    // === Modal Management ===

    function showModal(content) {
        const modal = document.createElement('div');
        modal.className = 'modal-backdrop';
        modal.innerHTML = content;
        modalContainer.appendChild(modal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    }

    function closeModal() {
        modalContainer.innerHTML = '';
    }

    function showConfirmationModal(message, onConfirm) {
        const content = `
            <div class="card rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
                <p class="text-lg font-medium mb-6">${message}</p>
                <div class="flex justify-center gap-4">
                    <button id="confirm-cancel" class="btn-default font-bold py-2 px-6 rounded-lg">Cancel</button>
                    <button id="confirm-ok" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-lg">Confirm</button>
                </div>
            </div>`;
        showModal(content);
        document.getElementById('confirm-ok').addEventListener('click', () => { closeModal(); onConfirm(); });
        document.getElementById('confirm-cancel').addEventListener('click', closeModal);
    }
    
    function showSettingsModal() {
        const createToggle = (id, label, isChecked) => `
            <label for="${id}" class="flex justify-between items-center cursor-pointer p-2 hover-bg-soft rounded-lg">
                <span class="text-muted text-sm">${label}</span>
                <div class="relative">
                    <input type="checkbox" id="${id}" class="sr-only setting-toggle" data-setting="${id.split('-')[1]}" ${isChecked ? 'checked' : ''}>
                    <div class="settings-toggle-bg block w-14 h-8 rounded-full"></div>
                    <div class="settings-toggle-dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full"></div>
                </div>
            </label>`;
        
        const content = `
            <div class="card rounded-xl shadow-2xl p-4 w-full max-w-xs">
                <div class="flex justify-between items-center mb-2"><h3 class="text-xl font-bold">Settings</h3><button id="settings-close" class="text-muted hover:text-red-500 text-2xl">&times;</button></div>
                <div class="space-y-1">
                    <h4 class="font-semibold text-primary mt-2 px-2 text-md">Notifications</h4>
                    ${createToggle('setting-selection', 'Selection Notifications', notificationSettings.selection)}
                    ${createToggle('setting-navigation', 'Navigation Notifications', notificationSettings.navigation)}
                    ${createToggle('setting-marking', 'Marking Notifications', notificationSettings.marking)}
                    ${createToggle('setting-submission', 'Submission Notifications', notificationSettings.submission)}
                </div>
            </div>`;
        showModal(content);
        document.getElementById('settings-close').addEventListener('click', closeModal);
        document.querySelectorAll('.setting-toggle').forEach(toggle => {
            toggle.addEventListener('change', (e) => {
                const setting = e.target.dataset.setting;
                notificationSettings[setting] = e.target.checked;
                localStorage.setItem('notificationSettings', JSON.stringify(notificationSettings));
            });
        });
    }

    function showResourcesModal(questionId) {
        const question = questions.find(q => q.id === questionId);
        if (!question || !question.resources) return;

        const content = `
            <div class="card rounded-xl shadow-2xl w-full max-w-lg max-h-[80vh] flex flex-col">
                <div class="p-4 flex justify-between items-center border-b border-default">
                    <h3 class="text-xl font-bold">Resources for Q${question.id}</h3>
                    <button id="resources-close" class="text-muted hover:text-red-500 text-2xl">&times;</button>
                </div>
                <div class="p-4 flex-grow overflow-y-auto">
                    <div class="border-b border-default mb-4">
                        <nav class="-mb-px flex space-x-6" aria-label="Tabs">
                            <button id="tab-concepts" class="whitespace-nowrap pb-3 px-1 border-b-2 font-medium text-md border-accent-color text-accent-color">Topics</button>
                            <button id="tab-videos" class="whitespace-nowrap pb-3 px-1 border-b-2 font-medium text-md border-transparent text-muted hover:text-primary">Videos</button>
                        </nav>
                    </div>
                    <ul id="content-concepts" class="list-disc list-inside space-y-2">${question.resources.concepts.map(c => `<li class="text-muted">${c}</li>`).join('')}</ul>
                    <div id="content-videos" class="hidden space-y-2">${question.resources.videos.map(v => `<a href="${v}" target="_blank" class="flex items-center p-2 hover-bg-soft rounded-lg"><i class="fab fa-youtube text-red-500 fa-lg mr-3"></i><span class="text-accent-color hover:underline text-sm">${v.split('search_query=')[1].replace(/\+/g, ' ')}</span></a>`).join('')}</div>
                </div>
            </div>`;
        showModal(content);
        document.getElementById('resources-close').addEventListener('click', closeModal);
        
        const tabConcepts = document.getElementById('tab-concepts');
        const tabVideos = document.getElementById('tab-videos');
        const contentConcepts = document.getElementById('content-concepts');
        const contentVideos = document.getElementById('content-videos');

        const switchTab = (tab) => {
            const activeClasses = ['border-accent-color', 'text-accent-color'];
            const inactiveClasses = ['border-transparent', 'text-muted'];
            if (tab === 'concepts') {
                contentConcepts.classList.remove('hidden');
                contentVideos.classList.add('hidden');
                tabConcepts.classList.add(...activeClasses);
                tabConcepts.classList.remove(...inactiveClasses);
                tabVideos.classList.add(...inactiveClasses);
                tabVideos.classList.remove(...activeClasses);
            } else {
                contentVideos.classList.remove('hidden');
                contentConcepts.classList.add('hidden');
                tabVideos.classList.add(...activeClasses);
                tabVideos.classList.remove(...inactiveClasses);
                tabConcepts.classList.add(...inactiveClasses);
                tabConcepts.classList.remove(...activeClasses);
            }
        };
        tabConcepts.addEventListener('click', () => switchTab('concepts'));
        tabVideos.addEventListener('click', () => switchTab('videos'));
    }

    function showMadeByModal() {
        const text = "welcome!";
        const content = `
            <div id="made-by-modal" class="card rounded-xl shadow-2xl p-6 w-full max-w-lg text-center relative">
                <button id="made-by-close" class="absolute top-2 right-3 text-muted hover:text-red-500 text-2xl">&times;</button>
                <div class="content mb-4">
                    <h2 class="text-wrapper text-primary text-4xl font-bold tracking-wide">
                        ${text.split('').map((letter, i) => `<span class="letter" style="--i:${i}">${letter}</span>`).join('')}
                    </h2>
                </div>
                <div class="space-y-4 mb-6">
                    <p class="text-muted text-sm">Hello, this is <span class="font-semibold text-yellow-500">illogical.exe</span>. Thank you for visiting!</p>
                    
                </div>
                
                <div class="flex justify-center items-center gap-6 pt-4 border-t border-default">
                    <a href="https://github.com/Manodip-dev?tab=repositories" target="_blank" class="social-link text-muted" title="GitHub"><i class="fab fa-github fa-2x"></i></a>
                    <a href="https://www.instagram.com/illogical.exe?igsh=MTFkMmZtcmRwaHkxcw==" target="_blank" class="social-link text-muted" title="Instagram"><i class="fab fa-instagram fa-2x"></i></a>
                    <p class="text-muted text-sm">Connect with me on social media</p>
                </div>
                <p class="text-muted text-sm mt-4">I appreciate your support. Looking forward to staying in touch!</p>
            </div>`;
        showModal(content);
        document.getElementById('made-by-close').addEventListener('click', closeModal);
    }

    // Initial call to start the application
    document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
